name: Bug report
description: Report reproducible MacBaram behavior without sensitive data.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include email addresses, account or device identifiers, serial numbers, payment or license data, private file paths, full logs, or raw diagnostics.
  - type: input
    id: mac-family
    attributes:
      label: Mac family
      placeholder: MacBook Pro, Mac mini, Mac Studio, or MacBook Air
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: macOS and MacBaram versions
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed sensitive data and did not attach full logs or raw diagnostics.
          required: true
